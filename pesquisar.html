<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Pesquise publicações e vídeos no TeurChat."><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/teur-refresh.css?v=19"><title>Pesquisar — TeurChat</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f7f7f7;font:15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:64px;position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 900px)/2));background:#090909ed;border-bottom:1px solid #292929}.brand{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:900}.brand img{width:34px;height:34px;border-radius:10px}.back{color:#ddd;text-decoration:none}.wrap{width:min(760px,100%);margin:0 auto;padding:28px 16px 80px}.wrap h1{font-size:28px;letter-spacing:-.8px;margin:0 0 8px}.muted{color:#aaa;line-height:1.5}.search-form{display:flex;gap:8px;margin:20px 0}.search-form input{min-width:0;flex:1;background:#111;color:#fff;border:1px solid #333;border-radius:999px;padding:14px 16px;font:inherit}.search-form button,.btn{border:1px solid #fff;background:#fff;color:#080808;border-radius:999px;padding:12px 17px;font:inherit;font-weight:750;cursor:pointer}.search-form button:disabled{opacity:.6}.results{display:flex;flex-direction:column;gap:12px}.result{padding:16px;background:#111;border:1px solid #292929;border-radius:15px}.result strong{font-size:14px}.result p{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}.result img,.result video{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:12px;margin-top:12px}.status{padding:18px;border:1px dashed #333;border-radius:14px;color:#aaa;line-height:1.5}.hidden{display:none!important}@media(max-width:560px){.top{height:58px;padding:0 13px}.wrap{padding:22px 12px 60px}.wrap h1{font-size:24px}.search-form{gap:6px}.search-form input{padding:12px}.search-form button{padding:11px 14px}}
</style></head><body><header class="top"><a class="brand" href="/" style="color:#fff;text-decoration:none"><img src="/assets/teurchat-logo.svg" alt="">TeurChat<span style="color:#888">.</span></a><a class="back" href="/">Voltar ao feed</a></header><main class="wrap"><h1>Pesquisar publicações</h1><p class="muted">Digite um termo e toque em Pesquisar. Nenhuma consulta é feita antes de você enviar a busca.</p><form id="searchForm" class="search-form"><input id="query" type="search" maxlength="100" placeholder="Buscar vídeos, pessoas ou assuntos…" autocomplete="off" required><button id="submit" type="submit">Pesquisar</button></form><section id="results" class="results" aria-live="polite"><div class="status">Digite algo acima para começar sua pesquisa.</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
(()=>{const $=s=>document.querySelector(s);let client=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>{try{return new Date(s).toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'})}catch{return''}};
try{if(window.supabase?.createClient&&/^https:\/\//.test(window.TEURCHAT_CONFIG?.supabaseUrl||'')&&window.TEURCHAT_CONFIG?.supabaseAnonKey)client=window.supabase.createClient(window.TEURCHAT_CONFIG.supabaseUrl,window.TEURCHAT_CONFIG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){console.error(e)}
$('#searchForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('#query').value.trim();if(!q)return;const out=$('#results'),btn=$('#submit');if(!client){out.innerHTML='<div class="status">A busca está indisponível porque a conexão do site não foi configurada.</div>';return}btn.disabled=true;btn.textContent='Buscando…';out.innerHTML='<div class="status">Procurando publicações…</div>';try{const safe=q.replace(/[\\%_]/g,'\\$&');const {data,error}=await client.from('posts').select('id,user_id,body,media_url,media_type,created_at,profiles(username,display_name,avatar_url)').ilike('body','%'+safe+'%').order('created_at',{ascending:false}).limit(30);if(error)throw error;const rows=data||[];if(!rows.length){out.innerHTML='<div class="status">Nenhuma publicação encontrada para “'+esc(q)+'”. Tente outro termo.</div>';return}out.innerHTML=rows.map(p=>{const name=p.profiles?.display_name||p.profiles?.username||'Usuário';let media='';if(p.media_url&&String(p.media_type||'').toLowerCase()==='video')media='<video controls playsinline preload="none" src="'+esc(p.media_url)+'"></video>';else if(p.media_url)media='<img loading="lazy" src="'+esc(p.media_url)+'" alt="Mídia da publicação">';return '<article class="result"><strong>'+esc(name)+' · @'+esc(p.profiles?.username||'usuario')+'</strong><div class="muted">'+esc(time(p.created_at))+'</div><p>'+esc(p.body||'')+'</p>'+media+'</article>'}).join('')}catch(err){console.error('TeurChat search failed',err);out.innerHTML='<div class="status">Não foi possível pesquisar agora: '+esc(err?.message||'erro desconhecido')+'. Verifique sua conexão e tente novamente.</div>'}finally{btn.disabled=false;btn.textContent='Pesquisar'}});
})();
</script></body></html>
