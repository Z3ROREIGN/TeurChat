<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Entre ou crie sua conta TeurChat."><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/teur-refresh.css?v=19"><title>Entrar — TeurChat</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#080808;color:#f7f7f7;font:15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.auth-shell{width:min(460px,100%)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:26px;letter-spacing:-1px;margin:0 0 24px}.brand img{width:42px;height:42px;border-radius:13px}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:26px}.card h1{font-size:27px;letter-spacing:-.8px;margin:0 0 7px}.muted{color:#aaa;line-height:1.55;margin:0 0 20px}.field{display:block;width:100%;margin:7px 0 14px;padding:13px 14px;background:#080808;border:1px solid #333;border-radius:12px;color:#fff;font:inherit}.field:focus{outline:2px solid #fff;outline-offset:2px}.label{display:block;font-size:13px;font-weight:700;color:#ddd}.btn{display:block;width:100%;border:1px solid #333;border-radius:999px;background:#1a1a1a;color:#fff;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer;margin-top:10px}.btn.primary{background:#fff;color:#080808;border-color:#fff}.btn:disabled{opacity:.6;cursor:wait}.switch{display:block;width:100%;border:0;background:none;color:#eee;padding:16px 8px;cursor:pointer}.status{padding:12px;border:1px solid #333;border-radius:12px;margin:12px 0;overflow-wrap:anywhere;line-height:1.5}.status.error{border-color:#744;color:#ffd5d5}.status.ok{border-color:#555;color:#fff}.back{display:block;text-align:center;color:#bbb;margin-top:18px;text-decoration:none}.back:hover{color:#fff}.hidden{display:none!important}
</style></head><body><main class="auth-shell"><div class="brand"><img src="/assets/teurchat-logo.svg" alt="">TeurChat<span style="color:#888">.</span></div><section class="card"><h1 id="title">Entrar na sua conta</h1><p class="muted" id="subtitle">Continue para curtir, publicar vídeos e conversar.</p><div id="status" class="status hidden" role="status" aria-live="polite"></div><form id="form"><div id="nameWrap" class="hidden"><label class="label" for="name">Nome de exibição</label><input class="field" id="name" name="name" maxlength="40" autocomplete="name" placeholder="Como quer ser chamado?"></div><div id="usernameWrap" class="hidden"><label class="label" for="username">Nome de usuário</label><input class="field" id="username" name="username" minlength="3" maxlength="24" autocomplete="username" placeholder="seu_usuario"></div><label class="label" for="email">E-mail</label><input class="field" id="email" name="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com"><label class="label" for="password">Senha</label><input class="field" id="password" name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo de 6 caracteres"><button class="btn primary" id="submit" type="submit">Entrar</button></form><button class="switch" id="switch" type="button">Ainda não tem conta? Criar conta</button></section><a class="back" href="/">← Voltar ao TeurChat</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
(()=>{const $=s=>document.querySelector(s);let mode=new URLSearchParams(location.search).get('modo')==='cadastro'?'signup':'login',client=null;
const say=(message,type='ok')=>{const el=$('#status');el.textContent=message;el.className='status '+type};
const errorText=e=>{if(e?.code==='23505'||/duplicate key|already registered|already exists/i.test(e?.message||''))return'Esse e-mail ou nome de usuário já está em uso.';if(/Invalid login credentials/i.test(e?.message||''))return'E-mail ou senha incorretos.';return e?.message||'Não foi possível concluir a operação.'};
function render(){const signup=mode==='signup';$('#title').textContent=signup?'Criar sua conta':'Entrar na sua conta';$('#subtitle').textContent=signup?'Crie sua conta para publicar e participar da comunidade.':'Continue para curtir, publicar vídeos e conversar.';$('#nameWrap').classList.toggle('hidden',!signup);$('#usernameWrap').classList.toggle('hidden',!signup);$('#name').required=signup;$('#username').required=signup;$('#password').autocomplete=signup?'new-password':'current-password';$('#submit').textContent=signup?'Criar conta':'Entrar';$('#switch').textContent=signup?'Já tem conta? Entrar':'Ainda não tem conta? Criar conta';$('#status').classList.add('hidden')}
$('#switch').addEventListener('click',()=>{mode=mode==='signup'?'login':'signup';render()});
$('#form').addEventListener('submit',async e=>{e.preventDefault();if(!client){say('A conexão com o Supabase não está configurada. Confira config.js.','error');return}const btn=$('#submit');btn.disabled=true;btn.textContent='Aguarde…';try{const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(mode==='signup'){const username=$('#username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,24);const name=$('#name').value.trim().slice(0,40)||username;if(username.length<3)throw new Error('O nome de usuário precisa ter pelo menos 3 caracteres.');const {data,error}=await client.auth.signUp({email,password,options:{data:{username,display_name:name}}});if(error)throw error;if(!data.session){say('Conta criada. Confira seu e-mail para confirmar o cadastro antes de entrar.');mode='login';render();say('Conta criada. Confira seu e-mail para confirmar o cadastro antes de entrar.');}else{say('Conta criada! Abrindo o TeurChat…');location.href='/'} }else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;say('Login concluído. Abrindo o TeurChat…');location.href='/'}}catch(err){say(errorText(err),'error')}finally{btn.disabled=false;btn.textContent=mode==='signup'?'Criar conta':'Entrar'}});
try{if(!window.supabase?.createClient||!/^https:\/\//.test(window.TEURCHAT_CONFIG?.supabaseUrl||'')||!window.TEURCHAT_CONFIG?.supabaseAnonKey){say('O site não está configurado para autenticação. Confira config.js.','error')}else{client=window.supabase.createClient(window.TEURCHAT_CONFIG.supabaseUrl,window.TEURCHAT_CONFIG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}}catch(e){say(errorText(e),'error')}render();
})();
</script></body></html>
